# ============================================================
# application-docker.properties - Perfil para Docker
# ============================================================

# En Docker, el host de la BD es el nombre del servicio en docker-compose
spring.datasource.url=jdbc:postgresql://slior-db:5432/slior
spring.datasource.username=slior
spring.datasource.password=slior

# Usar el secret de la variable de entorno
jwt.secret=${JWT_SECRET}

# Configuración de logs para el contenedor
logging.file.name=logs/slior-backend.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Geocoder (seguimos usando Nominatim por defecto)
geocoder.provider=nominatim
geocoder.nominatim.url=https://nominatim.openstreetmap.org/search
geocoder.throttle.ms=1000

# Desactivar Photon autostart en el contenedor (se gestiona vía Docker Compose si fuera necesario)
photon.autostart.enabled=false
