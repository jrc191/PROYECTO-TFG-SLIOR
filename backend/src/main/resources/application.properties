# ============================================================
# application.properties - SLIOR Backend
# Configuracio de desarrollo local
# ============================================================

spring.application.name=slior-backend
server.port=8080

# Perfil activo por defecto en desarrollo local
# En produccion, sobrescribir con variable de entorno: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# ======= Base de Datos PostgreSQL =======
spring.datasource.url=jdbc:postgresql://localhost:5432/slior
spring.datasource.username=slior
spring.datasource.password=slior
spring.datasource.driver-class-name=org.postgresql.Driver

# ======= JPA / Hibernate =======
# validate: comprueba que el esquema de la BD coincide con las entidades
# Usamos Flyway para las migraciones (db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ======= Flyway =======
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false


# ======= JWT =======
# Ver: docs/SETUP_LOCAL.md
jwt.secret=PLACEHOLDER_SET_IN_APPLICATION_LOCAL_PROPERTIES
# 1800000 ms = 30 minutos (access token)
jwt.expiration=1800000
# 604800000 ms = 7 dias (refresh token - fase futura)
jwt.refresh-expiration=604800000

# ======= Logging =======
logging.level.com.slior=DEBUG
logging.level.org.springframework.security=INFO

# ======= Photon autostart =======
photon.autostart.enabled=true
photon.jar-path=photon/photon-1.0.1.jar
photon.data-path=photon_data
photon.port=2322
photon.max-memory=-Xmx2G
