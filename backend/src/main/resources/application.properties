# ============================================================
# application.properties - SLIOR Backend
# Configuración de desarrollo local
# ============================================================

spring.application.name=slior-backend
server.port=8080

# Perfil activo por defecto en desarrollo local
# En producción, sobrescribir con variable de entorno: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# ======= Base de Datos PostgreSQL =======
spring.datasource.url=jdbc:postgresql://localhost:5432/slior
spring.datasource.username=slior
spring.datasource.password=slior
spring.datasource.driver-class-name=org.postgresql.Driver

# ======= JPA / Hibernate =======
# update: crea/modifica tablas automáticamente en desarrollo
# En producción usar 'validate' o 'none'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ======= JWT =======
# Ver: docs/SETUP_LOCAL.md
jwt.secret=PLACEHOLDER_SET_IN_APPLICATION_LOCAL_PROPERTIES
# 1800000 ms = 30 minutos (access token)
jwt.expiration=1800000
# 604800000 ms = 7 días (refresh token - fase futura)
jwt.refresh-expiration=604800000

# ======= Logging =======
logging.level.com.slior=DEBUG
logging.level.org.springframework.security=INFO

# ======= Photon autostart (para uso local desde IntelliJ) =======
photon.autostart.enabled=true
photon.jar-path=photon/photon-1.0.1.jar
photon.data-path=photon_data
photon.port=2322
photon.max-memory=-Xmx2G
