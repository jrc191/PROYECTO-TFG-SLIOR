<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SLIOR - Mis Rutas</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@600;700&amp;family=Space+Grotesk:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#050505",
                        "background-light": "#FFFFFF",
                        "background-dark": "#050505",
                        "surface": "#F4F4F5",
                        "text-main": "#050505",
                        "muted": "#71717A",
                        "accent-orange": "#FF5A00",
                        "accent-green": "#39FF14",
                        "accent-yellow": "#FFD700"
                    },
                    fontFamily: {
                        "heading": ["Space Grotesk", "sans-serif"],
                        "body": ["IBM Plex Sans", "sans-serif"],
                        "mono": ["IBM Plex Mono", "monospace"]
                    },
                    borderWidth: {
                        'thick': '2px'
                    },
                    boxShadow: {
                        'hard': '4px 4px 0px #050505',
                        'fab': '8px 8px 0px #FF5A00'
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background-light');
            color: theme('colors.text-main');
            font-family: theme('fontFamily.body');
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col relative bg-background-light dark:bg-background-dark">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 flex items-center justify-between h-[64px] bg-background-light dark:bg-background-dark border-b-thick border-primary px-4">
<button class="flex items-center justify-center w-[48px] h-[48px] min-h-[64px] active:bg-primary active:text-background-light transition-colors">
<span class="material-symbols-outlined text-[32px]">menu</span>
</button>
<h1 class="font-heading text-[20px] font-bold tracking-tight uppercase text-primary dark:text-background-light">
            Mis Rutas
        </h1>
<div class="flex items-center justify-center w-[48px] h-[48px] border-thick border-primary bg-surface overflow-hidden">
<span class="material-symbols-outlined text-[32px] text-primary">person</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 p-4 space-y-6 pb-[100px]">
<!-- Route Card: En Curso -->
<article class="h-[140px] bg-background-light border-thick border-primary shadow-hard p-4 flex flex-col justify-between active:bg-primary active:text-background-light transition-colors cursor-pointer group">
<div class="flex justify-between items-start">
<div>
<span class="inline-block bg-accent-orange text-primary font-bold text-[12px] px-3 py-1 rounded-[4px] border-thick border-primary uppercase mb-2">
                        En_Curso
                    </span>
<h2 class="font-body font-bold text-[20px] group-active:text-background-light">Ruta Zona Sur</h2>
</div>
<div class="text-right">
<span class="font-heading font-bold text-[16px] block group-active:text-background-light">120 MIN</span>
</div>
</div>
<div class="flex justify-between items-end">
<span class="font-mono font-medium text-[14px] text-muted group-active:text-background-light/70">24 OCT 2023</span>
<span class="material-symbols-outlined text-primary group-active:text-background-light">cloud_done</span>
</div>
</article>
<!-- Route Card: Planificada -->
<article class="h-[140px] bg-background-light border-thick border-primary shadow-hard p-4 flex flex-col justify-between active:bg-primary active:text-background-light transition-colors cursor-pointer group">
<div class="flex justify-between items-start">
<div>
<span class="inline-block bg-accent-yellow text-primary font-bold text-[12px] px-3 py-1 rounded-[4px] border-thick border-primary uppercase mb-2">
                        Planificada
                    </span>
<h2 class="font-body font-bold text-[20px] group-active:text-background-light">Ruta Centro</h2>
</div>
<div class="text-right">
<span class="font-heading font-bold text-[16px] block group-active:text-background-light">90 MIN</span>
</div>
</div>
<div class="flex justify-between items-end">
<span class="font-mono font-medium text-[14px] text-muted group-active:text-background-light/70">24 OCT 2023</span>
<span class="material-symbols-outlined text-accent-yellow" style="font-variation-settings: 'FILL' 0;">cloud_sync</span>
</div>
</article>
<!-- Route Card: Completada -->
<article class="h-[140px] bg-background-light border-thick border-primary shadow-hard p-4 flex flex-col justify-between active:bg-primary active:text-background-light transition-colors cursor-pointer group">
<div class="flex justify-between items-start">
<div>
<span class="inline-block bg-accent-green text-primary font-bold text-[12px] px-3 py-1 rounded-[4px] border-thick border-primary uppercase mb-2">
                        Completada
                    </span>
<h2 class="font-body font-bold text-[20px] group-active:text-background-light">Ruta Norte</h2>
</div>
<div class="text-right">
<span class="font-heading font-bold text-[16px] block group-active:text-background-light">150 MIN</span>
</div>
</div>
<div class="flex justify-between items-end">
<span class="font-mono font-medium text-[14px] text-muted group-active:text-background-light/70">24 OCT 2023</span>
<span class="material-symbols-outlined text-primary group-active:text-background-light">cloud_done</span>
</div>
</article>
</main>
<!-- Extended FAB -->
<div class="fixed bottom-6 right-6 z-50">
<button class="flex items-center h-[64px] bg-primary text-background-light px-6 border-thick border-primary shadow-fab active:scale-95 transition-transform font-heading font-bold text-[18px] uppercase gap-2">
<span class="material-symbols-outlined text-[24px]">add</span>
            Nueva Ruta
        </button>
</div>
</body></html>
