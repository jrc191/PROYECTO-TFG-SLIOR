<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Route Detail - SLIOR</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@600;700&amp;family=Space+Grotesk:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#f95b06",
            "background-light": "#FFFFFF",
            "background-dark": "#050505",
            "slior-black": "#050505",
            "slior-surface": "#F4F4F5",
            "slior-green": "#39FF14",
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"],
            "body": ["IBM Plex Sans", "sans-serif"],
            "mono": ["IBM Plex Mono", "monospace"],
          },
          borderRadius: {
            "DEFAULT": "4px",
            "none": "0px",
            "sm": "4px",
          },
          boxShadow: {
            "hard": "4px 4px 0px #050505",
            "hard-sm": "2px 2px 0px #050505",
          },
          borderWidth: {
            "thick": "2px",
          }
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background-color: #FFFFFF;
      color: #050505;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }
    .font-mono-custom {
      font-family: 'IBM Plex Mono', monospace;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col relative pb-[80px]">
<!-- Sticky Top Header -->
<header class="sticky top-0 z-50 bg-background-light border-b-thick border-slior-black h-[64px] flex items-center px-4">
<button aria-label="Go back" class="flex items-center justify-center w-[48px] h-[48px] border-thick border-transparent active:bg-slior-black active:text-white transition-colors">
<span class="material-symbols-outlined text-[32px]">arrow_back</span>
</button>
<h1 class="font-heading font-bold text-[24px] tracking-tight ml-2 truncate uppercase">RUTA 04 - CENTRO</h1>
</header>
<!-- Summary Block -->
<section class="h-[120px] bg-slior-surface border-b-thick border-slior-black flex flex-col items-center justify-center px-4 py-4 shrink-0">
<h2 class="font-heading font-bold text-[16px] text-slior-black uppercase tracking-widest mb-1">TIEMPO ESTIMADO</h2>
<div class="font-heading font-bold text-[32px] text-primary tracking-tight bg-background-light border-thick border-slior-black px-6 py-2 shadow-hard-sm">
      02:15:30
    </div>
</section>
<!-- Stop List -->
<main class="flex-1 flex flex-col px-4 py-6 gap-4 overflow-y-auto no-scrollbar">
<!-- Stop Item 1 (Completed) -->
<div class="h-[80px] bg-background-light border-thick border-slior-black shadow-hard flex items-center px-4 gap-4 transition-colors active:bg-slior-black active:text-white group">
<div class="w-[32px] h-[32px] shrink-0 border-thick border-slior-black bg-slior-green flex items-center justify-center group-active:border-white group-active:bg-transparent">
<span class="material-symbols-outlined text-slior-black font-bold text-[24px] group-active:text-white">check</span>
</div>
<div class="flex-1 flex flex-col justify-center min-w-0">
<p class="font-body font-bold text-[18px] truncate decoration-thick line-through text-slior-black/60 group-active:text-white/60">Calle Falsa 123</p>
<p class="font-mono-custom text-[14px] text-slior-black/60 truncate group-active:text-white/60">ENTREGA #1042</p>
</div>
</div>
<!-- Stop Item 2 (Active/Next) -->
<div class="h-[80px] bg-background-light border-thick border-slior-black shadow-hard flex items-center px-4 gap-4 transition-colors active:bg-slior-black active:text-white group relative overflow-hidden">
<!-- Active Indicator Bar -->
<div class="absolute left-0 top-0 bottom-0 w-[8px] bg-primary"></div>
<div class="w-[32px] h-[32px] shrink-0 border-thick border-slior-black bg-background-light flex items-center justify-center group-active:border-white">
<!-- Empty Checkbox -->
</div>
<div class="flex-1 flex flex-col justify-center min-w-0 ml-2">
<p class="font-body font-bold text-[18px] truncate">Av. Siempreviva 742</p>
<p class="font-mono-custom text-[14px] text-slior-black/70 truncate group-active:text-white/70">ENTREGA #1043</p>
</div>
<div class="shrink-0 flex items-center justify-center h-[32px] px-2 bg-primary border-thick border-slior-black text-white font-heading text-[14px] group-active:border-white">
        AHORA
      </div>
</div>
<!-- Stop Item 3 (Pending) -->
<div class="h-[80px] bg-background-light border-thick border-slior-black shadow-hard flex items-center px-4 gap-4 transition-colors active:bg-slior-black active:text-white group">
<div class="w-[32px] h-[32px] shrink-0 border-thick border-slior-black bg-background-light flex items-center justify-center group-active:border-white">
<!-- Empty Checkbox -->
</div>
<div class="flex-1 flex flex-col justify-center min-w-0">
<p class="font-body font-bold text-[18px] truncate">Boulevard de los Sueños Rotos 404</p>
<p class="font-mono-custom text-[14px] text-slior-black/70 truncate group-active:text-white/70">ENTREGA #1044</p>
</div>
</div>
<!-- Stop Item 4 (Pending) -->
<div class="h-[80px] bg-background-light border-thick border-slior-black shadow-hard flex items-center px-4 gap-4 transition-colors active:bg-slior-black active:text-white group">
<div class="w-[32px] h-[32px] shrink-0 border-thick border-slior-black bg-background-light flex items-center justify-center group-active:border-white">
<!-- Empty Checkbox -->
</div>
<div class="flex-1 flex flex-col justify-center min-w-0">
<p class="font-body font-bold text-[18px] truncate">Plaza de la República 10</p>
<p class="font-mono-custom text-[14px] text-slior-black/70 truncate group-active:text-white/70">ENTREGA #1045</p>
</div>
</div>
<!-- Stop Item 5 (Pending) -->
<div class="h-[80px] bg-background-light border-thick border-slior-black shadow-hard flex items-center px-4 gap-4 transition-colors active:bg-slior-black active:text-white group mb-4">
<div class="w-[32px] h-[32px] shrink-0 border-thick border-slior-black bg-background-light flex items-center justify-center group-active:border-white">
<!-- Empty Checkbox -->
</div>
<div class="flex-1 flex flex-col justify-center min-w-0">
<p class="font-body font-bold text-[18px] truncate">Callejón Diagon 99</p>
<p class="font-mono-custom text-[14px] text-slior-black/70 truncate group-active:text-white/70">ENTREGA #1046</p>
</div>
</div>
</main>
<!-- Sticky Bottom Action Button -->
<div class="fixed bottom-0 left-0 right-0 h-[80px] z-50 p-2 bg-background-light border-t-thick border-slior-black">
<button class="w-full h-full bg-[#39FF14] border-thick border-slior-black shadow-hard-sm flex items-center justify-center gap-3 active:translate-y-[2px] active:translate-x-[2px] active:shadow-none transition-all">
<span class="material-symbols-outlined font-bold text-[28px] text-slior-black">navigation</span>
<span class="font-heading font-bold text-[18px] text-slior-black uppercase tracking-wide">INICIAR NAVEGACIÓN</span>
</button>
</div>
</body></html>
